name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate version
        id: version
        run: |
          CALVER=$(date -u +"%Y-%m-%d")
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=${CALVER}+${SHORT_SHA}" >> $GITHUB_OUTPUT

      - name: Merge into release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git fetch origin release 2>/dev/null; then
            git checkout -B release origin/release
            git merge --no-ff -X theirs main -m "Release ${{ steps.version.outputs.version }}"
          else
            git checkout -b release
          fi

      - name: Build
        run: |
          PINCH_VERSION="${{ steps.version.outputs.version }}" cargo build --release
          cp target/release/pinch pinch-aarch64-apple-darwin

      - name: Publish
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          git tag "v${VERSION}"
          git push origin release "v${VERSION}"

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --generate-notes \
            pinch-aarch64-apple-darwin
        env:
          GH_TOKEN: ${{ github.token }}
